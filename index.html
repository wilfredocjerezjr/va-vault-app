<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VA Vault NATIVE</title>
    <style>
        /* --- NATIVE CSS (NO DOWNLOADS NEEDED) --- */
        :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --blue: #3b82f6; --green: #22c55e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; padding-bottom: 80px; }
        
        /* HEADER */
        .header { background: rgba(15, 23, 42, 0.9); padding: 15px; position: sticky; top: 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .logo { font-weight: 900; color: var(--blue); font-size: 1.2rem; }
        .badge { background: #dc2626; color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 4px; vertical-align: middle; margin-left: 5px; }
        .rate-box { text-align: right; }
        .rate-lbl { font-size: 0.6rem; color: #94a3b8; font-weight: bold; }
        .rate-val { font-family: monospace; font-size: 1.1rem; color: var(--green); font-weight: bold; }

        /* SEARCH */
        .search-area { padding: 10px 15px; background: #0f172a; position: sticky; top: 60px; z-index: 90; }
        input { width: 100%; padding: 12px 15px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--blue); }

        /* TABS & CONTENT */
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; animation: fade 0.2s; }
        @keyframes fade { from {opacity:0; transform:translateY(5px);} to {opacity:1; transform:translateY(0);} }

        /* CATEGORIES */
        .cat-scroll { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 15px; padding-bottom: 5px; }
        .cat-btn { background: #334155; border: none; color: #94a3b8; padding: 8px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: var(--blue); color: white; }

        /* SCRIPT CARDS */
        .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .card-head { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .card-title { font-weight: bold; font-size: 0.9rem; color: #60a5fa; }
        .card-tag { font-size: 0.6rem; background: #334155; padding: 2px 6px; border-radius: 4px; }
        .card-text { background: #0f172a; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; border-left: 3px solid var(--blue); margin-bottom: 12px; }
        .copy-btn { width: 100%; background: var(--blue); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .copy-btn:active { opacity: 0.8; transform: scale(0.98); }

        /* TOOLS GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tool-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 10px; }
        .tool-title { font-weight: bold; font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; display: block; }
        .big-val { font-size: 1.5rem; font-weight: 900; margin-top: 5px; }

        /* BOTTOM NAV */
        .nav { position: fixed; bottom: 0; width: 100%; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 10px 0; z-index: 200; }
        .nav-btn { background: none; border: none; color: #64748b; font-size: 0.7rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: var(--blue); }
        .nav-icon { font-size: 1.2rem; }

        /* TOAST */
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; opacity: 0; transition: 0.3s; pointer-events: none; }
        #toast.show { opacity: 1; bottom: 90px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">VA VAULT <span class="badge">PRO</span></div>
        <div class="rate-box">
            <div class="rate-lbl">USD RATE</div>
            <div class="rate-val" id="live-rate">₱58.50</div>
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="search" placeholder="Search 50+ Scripts..." onkeyup="doSearch()">
    </div>

    <div id="main-container">
        
        <div id="tab-vault" class="tab-content active">
            <div class="cat-scroll" id="cat-list">
                </div>
            <div id="script-list">
                </div>
        </div>

        <div id="tab-tools" class="tab-content">
            <div class="tool-box">
                <span class="tool-title" style="color:#60a5fa">SALARY CALCULATOR</span>
                <div class="grid">
                    <div>
                        <span class="rate-lbl">RATE ($)</span>
                        <input type="number" id="in-rate" value="5" oninput="calc()" style="padding:8px;">
                    </div>
                    <div>
                        <span class="rate-lbl">HOURS/WK</span>
                        <input type="number" id="in-hours" value="40" oninput="calc()" style="padding:8px;">
                    </div>
                </div>
                <div style="margin-top:15px; background:#0f172a; padding:10px; border-radius:8px; text-align:center;">
                    <div class="rate-lbl">MONTHLY GROSS</div>
                    <div class="big-val" id="out-php" style="color:white">₱0</div>
                    <div class="rate-lbl" id="out-usd">$0 USD</div>
                </div>
            </div>

            <div class="tool-box">
                <span class="tool-title" style="color:#f87171">FEE DEDUCTOR (NET PAY)</span>
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <button onclick="fee(0.2)" class="cat-btn" style="flex:1">Upwork 20%</button>
                    <button onclick="fee(0.1)" class="cat-btn" style="flex:1">10%</button>
                    <button onclick="fee(0.05)" class="cat-btn" style="flex:1">Raket 5%</button>
                </div>
                <div style="background:#0f172a; padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                    <span class="rate-lbl">TAKE HOME:</span>
                    <span class="big-val" id="out-net" style="font-size:1.2rem; color:#4ade80">₱0</span>
                </div>
            </div>
        </div>

        <div id="tab-conf" class="tab-content">
            <div class="tool-box">
                <span class="tool-title">SYSTEM CONFIG</span>
                <p class="rate-lbl">If live rate fails, set manual rate here:</p>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="number" id="man-rate" placeholder="58.50">
                    <button class="copy-btn" style="width:auto;" onclick="saveRate()">SAVE</button>
                </div>
            </div>
        </div>

    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('tab-vault', this)">
            <span class="nav-icon">📚</span> VAULT
        </button>
        <button class="nav-btn" onclick="switchTab('tab-tools', this)">
            <span class="nav-icon">🧮</span> TOOLS
        </button>
        <button class="nav-btn" onclick="switchTab('tab-conf', this)">
            <span class="nav-icon">⚙️</span> CONFIG
        </button>
    </div>

    <div id="toast">COPIED TO CLIPBOARD</div>
